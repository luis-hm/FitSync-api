description = ""
authors = [
    {name = "luishm",email = "luisfelipeholanda12@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "daphne (>=4.2.1,<5.0.0)",
